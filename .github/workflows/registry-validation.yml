name: Registry validation

# Public repository: never execute pull-request code on private runners.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'IronbellyOrg/irondots' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, small]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout trusted main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: Validate registry and run offline contract tests
        run: |
          set -euo pipefail
          python3 --version
          python3 scripts/validate_registry.py
          python3 -m unittest discover -s tests -v
      - name: Record scope of evidence
        run: |
          printf '%s\n' 'Registry structure and offline contract tests passed.' 'This is not dot import, live evaluation, or installation evidence.' >> "$GITHUB_STEP_SUMMARY"
